syntax = "proto3";

package vistay.user.v1;

import "vistay/common/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.vistay.contracts.user.v1";

// Internal authorization reads for trusted ViStay services.
//
// Transport contract:
// - clients MUST use mTLS and the server MUST authorize the caller from the
//   authenticated certificate identity (for example, a URI SAN); caller
//   identity MUST NOT be accepted from request fields or caller-set metadata;
// - clients MUST set a deadline no longer than two seconds;
// - clients SHOULD propagate the request correlation ID as gRPC metadata;
// - the operation is idempotent and may be retried only within that deadline.
service UserAuthorizationService {
  // Returns the latest authorization snapshot for one account. Servers SHOULD
  // fail requests without an authenticated/allow-listed service identity with
  // UNAUTHENTICATED or PERMISSION_DENIED, and expired calls with
  // DEADLINE_EXCEEDED.
  rpc GetAuthorizationSnapshot(GetAuthorizationSnapshotRequest)
      returns (GetAuthorizationSnapshotResponse);

  // Returns role-owned action policies in one call. Unknown, inactive, or
  // wrong-audience role codes are intentionally omitted and never grant
  // access. Callers MUST treat an omitted requested role as deny-by-default.
  rpc GetRolePolicies(GetRolePoliciesRequest)
      returns (GetRolePoliciesResponse);
}

message GetAuthorizationSnapshotRequest {
  vistay.common.v1.AccountRef account = 1;
  int64 minimum_authorization_version = 2;
}

message GetAuthorizationSnapshotResponse {
  bool active = 1;
  optional string profile_id = 2;
  repeated string roles = 3;
  repeated string permissions = 4;
  int64 authorization_version = 5;
  repeated vistay.common.v1.PermissionGrant grants = 6;
}

message GetRolePoliciesRequest {
  vistay.common.v1.AccountType account_type = 1;
  repeated string role_codes = 2;
}

message GetRolePoliciesResponse {
  repeated RolePolicy policies = 1;
  int64 catalog_version = 2;
  int32 schema_version = 3;
}

message RolePolicy {
  string role_code = 1;
  int64 role_version = 2;
  repeated RolePermissionPolicy permissions = 3;
}

message RolePermissionPolicy {
  string permission_code = 1;
  repeated vistay.common.v1.DataScopeType allowed_scopes = 2;
  repeated string partition_types = 3;
}
