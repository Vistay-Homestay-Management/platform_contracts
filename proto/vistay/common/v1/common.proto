syntax = "proto3";

package vistay.common.v1;

option java_multiple_files = true;
option java_package = "com.vistay.contracts.common.v1";

message AccountRef {
  string account_id = 1;
  AccountType account_type = 2;
}

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_CUSTOMER = 1;
  ACCOUNT_TYPE_ADMIN = 2;
  ACCOUNT_TYPE_HOST = 3;
}

enum DataScopeType {
  DATA_SCOPE_TYPE_UNSPECIFIED = 0;
  DATA_SCOPE_TYPE_SELF = 1;
  DATA_SCOPE_TYPE_OWN = 2;
  DATA_SCOPE_TYPE_ASSIGNED = 3;
  DATA_SCOPE_TYPE_ALL = 4;
  DATA_SCOPE_TYPE_PARTITION = 5;
}

message PartitionGrant {
  // Stable uppercase dimension owned by the resource service, for example
  // PROPERTY, BUILDING, BRANCH, AREA, CITY or ORGANIZATION.
  string partition_type = 1;
  // Opaque UUID of the partition. Consumers must not infer its owning table.
  string partition_id = 2;
}

message PermissionGrant {
  string permission_code = 1;
  repeated DataScopeType scopes = 2;
  repeated PartitionGrant partitions = 3;
}

message ActorContext {
  AccountRef account = 1;
  optional string profile_id = 2;
  repeated string roles = 3;
  repeated string permissions = 4;
  int64 authorization_version = 5;
  string correlation_id = 6;
  repeated PermissionGrant grants = 7;
}

message Money {
  int64 minor_units = 1;
  string currency = 2;
}

message PageCursor {
  optional string after = 1;
  int32 limit = 2;
}

message ErrorDetail {
  string code = 1;
  string message = 2;
  map<string, string> metadata = 3;
}
