syntax = "proto3";

package vistay.booking.v1;

option java_multiple_files = true;
option java_package = "com.vistay.contracts.booking.v1";
option java_outer_classname = "InventoryReconciliationProto";

// Internal, mTLS-authenticated recovery API for consumers of
// vistay.booking.inventory-block-changed.v1. The response is one complete,
// revision-pinned current projection for exactly one property.
service InventoryReconciliationService {
  rpc ReconcileInventory(ReconcileInventoryRequest)
      returns (ReconcileInventoryResponse);
}

message ReconcileInventoryRequest {
  string property_id = 1;
  // Last property inventory revision durably applied by this consumer.
  int64 consumer_inventory_revision = 2;
}

message ReconcileInventoryResponse {
  string property_id = 1;
  int64 inventory_revision = 2;
  // True only when consumer_inventory_revision equals inventory_revision.
  // In that case blocks is empty and the consumer keeps its current projection.
  bool not_modified = 3;
  // Complete current TENTATIVE/ACTIVE projection when not_modified is false.
  repeated InventoryReconciliationBlock blocks = 4;
  // RFC 3339 UTC time assigned inside the repeatable-read snapshot.
  string observed_at = 5;
}

message InventoryReconciliationBlock {
  string inventory_block_id = 1;
  string block_type = 2;
  string status = 3;
  string start_date = 4;
  string end_date_exclusive = 5;
  int64 block_version = 6;
  // Provider code only. The external channel reference is never exposed.
  optional string channel_provider = 7;
}
