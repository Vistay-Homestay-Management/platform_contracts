syntax = "proto3";

package vistay.booking.v1;

option java_multiple_files = true;
option java_package = "com.vistay.contracts.booking.v1";
option java_outer_classname = "BookingAuthorizationProto";

service BookingAuthorizationService {
  rpc GetBookingAuthorizationRecord(GetBookingAuthorizationRecordRequest)
      returns (GetBookingAuthorizationRecordResponse);
}

enum BookingPartitionResolutionStatus {
  BOOKING_PARTITION_RESOLUTION_STATUS_UNSPECIFIED = 0;
  BOOKING_PARTITION_RESOLUTION_STATUS_MAPPED = 1;
  BOOKING_PARTITION_RESOLUTION_STATUS_MISSING = 2;
  BOOKING_PARTITION_RESOLUTION_STATUS_UNAVAILABLE = 3;
}

message GetBookingAuthorizationRecordRequest {
  string booking_id = 1;
}

message GetBookingAuthorizationRecordResponse {
  string booking_id = 1;
  optional string customer_id = 2;
  string property_id = 3;
  optional string assigned_admin_user_id = 4;
  repeated string active_attributed_admin_user_ids = 5;
  optional string branch_id = 6;
  BookingPartitionResolutionStatus partition_resolution_status = 7;
  int64 partition_membership_version = 8;
}
