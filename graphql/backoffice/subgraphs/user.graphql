extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: ["@authenticated"]
  )

type Query {
  """The profile bound to the authenticated Backoffice access token."""
  viewer: BackofficeViewer! @authenticated
  myProfileLinkStatus: ProfileAccountLink! @authenticated
  profileLinkRequests(profileType: AccountType, status: String = "APPROVAL_PENDING", first: Int = 50): [ProfileLinkReview!]! @authenticated
  userDirectory(accountType: AccountType!, search: String, first: Int = 25, after: String): UserDirectoryPage! @authenticated
  userProfile(accountType: AccountType!, profileId: ID!): UserProfileDetails! @authenticated
  identityPolicies: [IdentityPolicy!]! @authenticated
}

type Mutation {
  protectProfileIdentityDocument(input: ProtectProfileIdentityDocumentInput!): ProtectedIdentityDocument! @authenticated
  requestMyProfileLink(input: RequestProfileLinkInput!): ProfileAccountLink! @authenticated
  verifyMyProfileLink(input: VerifyProfileLinkInput!): ProfileAccountLink! @authenticated
  approveProfileLink(input: ApproveProfileLinkInput!): ProfileAccountLink! @authenticated
  rejectProfileLink(input: RejectProfileLinkInput!): ProfileAccountLink! @authenticated
  createCustomerProfile(input: CreateCustomerProfileInput!): UserProfileDetails! @authenticated
  createAdminProfile(input: CreateAdminProfileInput!): UserProfileDetails! @authenticated
  createHostProfile(input: CreateHostProfileInput!): UserProfileDetails! @authenticated
  updateIdentityPolicy(input: UpdateIdentityPolicyInput!): IdentityPolicy! @authenticated
}

type BackofficeViewer {
  """The Keycloak `sub` UUID from the Backoffice realm."""
  accountId: ID!

  """The User service profile UUID; distinct from `accountId`."""
  profileId: ID!

  displayName: String!
  email: String!
  roles: [String!]!
  permissions: [String!]!
  authorizationVersion: Int!
}

enum AccountType { CUSTOMER ADMIN HOST }

type ProtectedIdentityDocument {
  id: ID!
  profileType: AccountType!
  profileId: ID!
  lookupKeyVersion: Int!
  encryptionKeyVersion: Int!
  assuranceLevel: String!
  rowVersion: String!
  createdAt: String!
}

type ProfileAccountLink {
  linkId: ID
  challengeId: ID
  profileType: AccountType!
  status: String!
  maskedRecipient: String
  expiresAt: String
  requiresApproval: Boolean!
  replayed: Boolean!
}

type ProfileLinkReview {
  linkId: ID!
  profileType: AccountType!
  profileId: ID!
  authAccountId: ID!
  status: String!
  linkMethod: String!
  requestedAt: String!
  maskedRecipient: String
  displayName: String
}

input ProtectProfileIdentityDocumentInput {
  profileType: AccountType!
  profileId: ID!
  cccd: String!
  expectedProfileVersion: String!
  reason: String!
}

input RequestProfileLinkInput { displayName: String!, cccd: String! }
input VerifyProfileLinkInput { challengeId: ID!, code: String! }
input ApproveProfileLinkInput { linkId: ID!, reason: String! }
input RejectProfileLinkInput { linkId: ID!, reason: String! }

type UserDirectoryPage { nodes: [UserDirectoryEntry!]!, totalCount: Int!, nextCursor: String }
type UserDirectoryEntry {
  profileId: ID!, accountId: ID, accountType: AccountType!, displayName: String!, email: String,
  contactPhone: String, status: String!, referenceCode: String, subtype: String,
  verificationStatus: String, joinedOn: String, createdAt: String!, updatedAt: String!
}
type UserProfileDetails {
  profileId: ID!, accountId: ID, accountType: AccountType!, displayName: String!, email: String,
  contactPhone: String, status: String!, referenceCode: String, subtype: String,
  verificationStatus: String, relevantDate: String, address: String, taxCode: String,
  version: Int!, createdAt: String!, updatedAt: String!
}
type IdentityPolicy {
  accountType: AccountType!, policyVersion: Int!, registrationEnabled: Boolean!, linkMode: String!,
  linkDeadlineSeconds: Int!, otpTtlSeconds: Int!, maxOtpAttempts: Int!,
  disableGracePeriodSeconds: Int!, purgeAfterSeconds: Int!, active: Boolean!, updatedAt: String!
}
input CreateCustomerProfileInput {
  fullName: String!, email: String, contactPhone: String, dateOfBirth: String,
  address: String, reason: String!, idempotencyKey: String!
}
input CreateAdminProfileInput {
  fullName: String!, email: String, contactPhone: String, employeeCode: String,
  subtype: String! = "STAFF", hiredOn: String, reason: String!, idempotencyKey: String!
}
input CreateHostProfileInput {
  fullName: String!, email: String, contactPhone: String, hostCode: String,
  address: String, taxCode: String, reason: String!, idempotencyKey: String!
}
input UpdateIdentityPolicyInput {
  accountType: AccountType!, registrationEnabled: Boolean!, linkMode: String!,
  expectedPolicyVersion: Int!, reason: String!, idempotencyKey: String!
}
